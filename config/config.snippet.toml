# =============================================================================
# Grok Privacy Filter — Config-Snippet fuer ~/.grok/config.toml
# Nach Aenderung: neue Grok-Session (/new) oder VS Code Window Reload.
# =============================================================================

[cli]
auto_update = false

[marketplace]
official_marketplace_auto_installed = false

[features]
telemetry = false
feedback = false
codebase_indexing = false
remote_fetch = false

[telemetry]
trace_upload = false
mixpanel_enabled = false

[harness]
disable_codebase_upload = true

[memory]
enabled = false

# Pflicht fuer VS Code Extension + CLI: Chat ueber lokalen Filter-Proxy
# Proxy starten:  py -3 ~/.grok/proxy/ensure_proxy.py
# Autostart:      scripts/install_autostart.ps1
# Mit VS Code:    scripts/install_vscode.ps1
[endpoints]
cli_chat_proxy_base_url = "http://127.0.0.1:18743/v1"

[permission]
deny = [
  "Bash(*cli-chat-proxy.grok.com*)",
  "Bash(*storage.googleapis.com*)",
  "Bash(*api.x.ai*)",
  "Bash(*code.grok.com*)",
  "Bash(*curl*x.ai*)",
  "Bash(*curl*grok.com*)",
  "Bash(*wget*x.ai*)",
  "Bash(*wget*grok.com*)",
  "Bash(*Invoke-WebRequest*x.ai*)",
  "Bash(*Invoke-WebRequest*grok.com*)",
  "Bash(*iwr*x.ai*)",
  "Bash(*iwr*grok.com*)",
]
